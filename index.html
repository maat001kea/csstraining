<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code in the Dark 1</title>
    <link rel="stylesheet" href="assets/reset.css" />
    <link rel="stylesheet" href="./assets/global.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="profile-card">
      <img src="profile.png" alt="Cassidy Williams" class="profile-image" />
      <div class="profile-info">
        <h1>Cassidy Williams</h1>
        <p>CTO at Contenda</p>
        <div class="social-icons">
          <a href="#">
            <svg width="25" height="25">
              <use href="icons.svg#mastodon"></use>
            </svg>
          </a>
          <a href="#">
            <svg width="25" height="25">
              <use href="icons.svg#github"></use>
            </svg>
          </a>
          <a href="#">
            <svg width="25" height="25">
              <use href="icons.svg#website"></use>
            </svg>
          </a>
          <a href="#">
            <svg width="25" height="25">
              <use href="icons.svg#twitter"></use>
            </svg>
          </a>
        </div>
      </div>
    </div>
    <!-- Overlay -->
    <div data-overlay>
      <img src="./assets/image.png" alt="" />
    </div>
  </body>
</html>
